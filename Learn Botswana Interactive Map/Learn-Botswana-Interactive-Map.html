<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>Explore Botswana's Heritage</title>
<style>
  /* ============================================================
     DESIGN TOKENS
     ============================================================ */
  :root{
    --ink:        #f4ece0;
    --ink-soft:   #d9cbb8;
    --muted:      #b09d87;
    --panel:      rgba(32, 25, 19, .86);
    --panel-line: rgba(255,255,255,.10);
    --land:       #d8bd94;
    --land-line:  #8a6a44;

    /* Category accents */
    --c-museum:     #2b7ea6;
    --c-historical: #c14f28;
    --c-natural:    #38895a;

    --radius: 16px;
    --tap: 44px;
  }

  *, *::before, *::after{ box-sizing: border-box; }

  html, body{ height: 100%; }

  body{
    margin: 0;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
                 "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1200px 720px at 50% -12%, #2e241a 0%, transparent 62%),
      radial-gradient(900px 620px at 105% 115%, #241a13 0%, transparent 58%),
      #120f0c;
    overflow: hidden;                    /* kiosk: no page scroll */
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
  }

  /* ============================================================
     SHELL LAYOUT
     ============================================================ */
  .app{
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    padding-bottom: calc(64px + env(safe-area-inset-bottom));
  }

  .stage{
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding: 8px 16px 8px;
    gap: 8px;
  }

  .info-panel{
    flex: 0 0 38vh;
    max-height: 42vh;
    overflow: auto;
    background: #fff;
    color: #241c14;
    border-radius: var(--radius);
    padding: 14px 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,.25);
    position: relative;
    z-index: 40;
  }
  .info-panel .info-instruction{
    margin: 0;
    color: #6b5a48;
    font-size: 14px;
  }
  .info-panel .info-pill{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .07em;
    text-transform: uppercase;
    color: #fff;
  }
  .info-panel h2{
    margin: 8px 0 6px;
    font-size: 18px;
    line-height: 1.24;
    color: #1c1610;
  }
  .info-panel .info-desc{
    margin: 0;
    font-size: 14px;
    line-height: 1.52;
    color: #4a3d30;
  }
  .info-panel .info-meta{
    margin: 10px 0 0;
    font-size: 11.5px;
    letter-spacing: .05em;
    color: #8a7660;
    font-variant-numeric: tabular-nums;
  }

  /* Bottom navigation */
  #bottomNav{
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 50;
    display: flex;
    justify-content: space-around;
    align-items: center;
    height: 64px;
    padding-bottom: env(safe-area-inset-bottom);
    background: #D17226;
    border-top: 1px solid rgba(255,255,255,.08);
    backdrop-filter: blur(12px);
  }
  .navbtn{
    flex: 1 1 0;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    background: none;
    border: none;
    color: rgba(255,255,255,.45);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .navbtn svg{
    width: 24px;
    height: 24px;
  }
  .navbtn.active{
    color: #e8a33d;
  }

  .legend-toggle{
    position: absolute;
    top: 8px;
    right: 8px;
    z-index: 35;
    min-height: 36px;
    padding: 0 12px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,.22);
    background: rgba(30,24,18,.85);
    color: var(--ink);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }

  /* The wrapper ALWAYS has exactly the SVG's aspect ratio, so that
     percentage-positioned markers land on the right pixel. */
  .map-frame{
    position: relative;
    margin: auto;
    isolation: isolate;
  }

  #botswana-map{
    display: block;
    width: 100%;
    height: 100%;
    overflow: visible;
    filter: drop-shadow(0 22px 44px rgba(0,0,0,.55));
  }

  /* Country / district geometry — warm sand with a darker stroke */
  #botswana-map path,
  #botswana-map polygon,
  #botswana-map polyline{
    fill: url(#landGrad);
    stroke: var(--land-line);
    stroke-width: 1.1;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
  }

  /* Hide district label points */
  #botswana-map g#label_points,
  #botswana-map #label_points{
    display: none !important;
  }

  /* ============================================================
     MARKER LAYER
     Markers live in HTML space (never inside the SVG) so they keep a
     constant, finger-friendly screen size at any scale.
     ============================================================ */
  .marker-layer{
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 20;
  }

  .marker{
    position: absolute;
    width: var(--tap);
    height: var(--tap);
    margin: 0;
    padding: 0;
    border: 0;
    background: none;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    display: grid;
    place-items: center;
    pointer-events: auto;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
    transition: opacity .22s ease, transform .22s cubic-bezier(.2,.8,.3,1);
    animation: marker-in .42s cubic-bezier(.2,.9,.3,1) backwards;
  }

  @keyframes marker-in{
    from{ opacity: 0; transform: translate(-50%, -50%) scale(.4); }
    to  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }

  .marker-inner{
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--c, #555);
    border: 2.5px solid #fdf6ea;
    box-shadow: 0 4px 12px rgba(0,0,0,.5), 0 0 0 1px rgba(0,0,0,.35);
    transition: transform .18s cubic-bezier(.2,.8,.3,1), box-shadow .18s ease;
  }

  .marker-inner svg{
    width: 18px;
    height: 18px;
    display: block;
    fill: #fff;
  }

  /* Focus / hover / active states */
  .marker:hover .marker-inner,
  .marker:focus-visible .marker-inner{
    transform: scale(1.12);
    box-shadow: 0 6px 18px rgba(0,0,0,.6), 0 0 0 1px rgba(0,0,0,.35);
  }

  .marker:focus-visible{
    outline: 3px solid #ffd79a;
    outline-offset: 2px;
    border-radius: 50%;
  }

  .marker.is-active{ z-index: 5; }
  .marker.is-active .marker-inner{
    transform: scale(1.16);
    box-shadow: 0 6px 20px rgba(0,0,0,.6), 0 0 0 4px rgba(255, 214, 150, .35);
  }

  .marker.is-dimmed{
    opacity: .22;
    transform: translate(-50%, -50%) scale(.78);
  }

  /* ============================================================
     LEGEND  (also acts as a category filter)
     ============================================================ */
  .legend{
    position: absolute;
    left: 16px;
    bottom: 16px;
    z-index: 30;
    width: 226px;
    padding: 12px 12px 10px;
    border-radius: var(--radius);
    background: var(--panel);
    border: 1px solid var(--panel-line);
    box-shadow: 0 18px 40px rgba(0,0,0,.5);
    backdrop-filter: blur(14px) saturate(1.2);
    -webkit-backdrop-filter: blur(14px) saturate(1.2);
    transition: opacity .25s ease;
  }

  .legend h2{
    margin: 0 0 8px;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .legend-list{ list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }

  .legend-item{
    width: 100%;
    min-height: 40px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 8px;
    border: 1px solid transparent;
    border-radius: 11px;
    background: transparent;
    color: var(--ink-soft);
    font: inherit;
    font-size: 13px;
    text-align: left;
    cursor: pointer;
    transition: background .16s ease, border-color .16s ease, color .16s ease;
  }

  .legend-item:hover{ background: rgba(255,255,255,.06); }

  .legend-item:focus-visible{
    outline: 2px solid #ffd79a;
    outline-offset: 1px;
  }

  .legend-item[aria-pressed="true"]{
    background: rgba(255,255,255,.10);
    border-color: rgba(255,255,255,.20);
    color: #fff;
  }

  .legend-ico{
    width: 24px; height: 24px;
    flex: 0 0 24px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--c);
    box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.85);
  }
  .legend-ico svg{ width: 13px; height: 13px; fill: #fff; display: block; }

  .legend-label{ flex: 1 1 auto; }

  .legend-count{
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    background: rgba(255,255,255,.07);
    border-radius: 999px;
    padding: 1px 7px;
  }

  .legend-total{
    margin: 9px 0 0;
    padding-top: 9px;
    border-top: 1px solid var(--panel-line);
    font-size: 11.5px;
    color: var(--muted);
    letter-spacing: .02em;
  }

  /* ============================================================
     RESPONSIVE
     ============================================================ */
  @media (max-width: 720px){
    .stage{ padding: 6px 8px 8px; }

    .legend{
      left: 8px;
      right: 8px;
      bottom: 8px;
      width: auto;
      padding: 8px 8px 6px;
    }
    .legend h2{ display: none; }
    .legend-list{
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
    }
    .legend-item{
      flex-direction: column;
      gap: 3px;
      min-height: 56px;
      padding: 6px 2px;
      text-align: center;
      font-size: 11px;
      line-height: 1.15;
    }
    .legend-count{ display: none; }
    .legend-total{ display: none; }

    .stage{ padding-bottom: 78px; }  /* keep the map clear of the legend */
  }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>

    historical:
      '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">' +
        '<path d="M12 1.8 14.7 7.6V19.2H9.3V7.6L12 1.8Z"/>' +
        '<rect x="7.2" y="19" width="9.6" height="2.9" rx=".8"/>' +
      '</svg>',

    /* Rock arch / cave mouth — natural monument */
    natural:
      '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">' +
        '<path d="M2.6 19V17c0-5.6 4.2-10.1 9.4-10.1S21.4 11.4 21.4 17v2h-5.1v-2' +
              'c0-2.8-1.9-5.1-4.3-5.1S7.7 14.2 7.7 17v2H2.6Z"/>' +
        '<rect x="1.8" y="19.6" width="20.4" height="2.2" rx="1.1"/>' +
      '</svg>'
  };

  const CATEGORIES = {
    museum:     { label: 'Museum',            color: 'var(--c-museum)'     },
    historical: { label: 'Historical Site',   color: 'var(--c-historical)' },
    natural:    { label: 'Natural Monument',  color: 'var(--c-natural)'    }
  };

  /* ============================================================
     3. SITE DATA
     ------------------------------------------------------------
     Structure:
       id          unique string
       name        display name (also used for aria-label)
       category    'museum' | 'historical' | 'natural'
       lat / lng   real-world coordinates
       description one sentence, shown in the info panel
       x / y       OPTIONAL hand-tuned overrides in SVG units.
                   If either is present it wins over the projected value,
                   so you can nudge a marker that lands slightly off.
     ============================================================ */
  const SITES = [
    {
      id: 'botswana-national-museum',
      name: 'Botswana National Museum',
      category: 'museum',
      lat: -24.656994, lng: 25.919657,
      description: "Established in 1967 and opened in Gaborone in 1968, the National Museum and Art Gallery is the country's principal repository of ethnographic, natural-history and contemporary art collections."
    },
    {
      id: 'khama-iii-memorial-museum',
      name: 'Khama III Memorial Museum',
      category: 'museum',
      lat: -22.382132, lng: 26.708068,
      description: "Housed in a historic red-brick building in Serowe, it documents the Bangwato royal line from Chief Khama III to Sir Seretse Khama and keeps a dedicated section on the author Bessie Head."
    },
    {
      id: 'phuthadikobo-museum',
      name: 'Phuthadikobo Museum',
      category: 'museum',
      lat: -24.387833, lng: 26.152055,
      description: "Perched on Phuthadikobo Hill above Mochudi in a 1921 schoolhouse, it preserves Bakgatla-ba-Kgafela craft, historical photography and the traditions of bogwera and bojale initiation."
    },
    {
      id: 'supa-ngwao-museum',
      name: 'Supa Ngwao Museum',
      category: 'museum',
      lat: -21.173611, lng: 27.5125,
      description: "Founded in Francistown in 1986, its name means 'show culture' and its exhibits trace Kalanga heritage, early Monarch Mine gold working and the development of the region's railway."
    },
    {
      id: 'tsodilo-hills',
      name: 'Tsodilo Hills',
      category: 'historical',
      lat: -18.9667, lng: 21.7500,
      description: "A UNESCO World Heritage Site known as the 'Louvre of the Desert', these sacred quartzite hills hold more than 4,500 rock paintings across over 400 individual sites."
    },
    {
      id: 'old-palapye',
      name: 'Old Palapye',
      category: 'historical',
      lat: -22.6167, lng: 27.5000,
      description: "Capital of the Bangwato under Khama III from 1889 until 1902, its stone ruins include the London Missionary Society church begun around 1892 and the graves of the royal homesteads."
    },
    {
      id: 'domboshaba-ruins',
      name: 'Domboshaba Ruins',
      category: 'historical',
      lat: -20.5994637, lng: 27.3731012,
      description: "A dry-stone walled Kalanga settlement occupied from roughly 1450 to the late 17th century, built in the same masonry tradition as Great Zimbabwe and Khami."
    },
    {
      id: 'gcwihaba-caves',
      name: 'Gcwihaba Caves',
      category: 'natural',
      lat: -20.0167, lng: 21.7833,
      description: "A National Monument in a remote stretch of the Kalahari, this limestone cavern system of stalactites, stalagmites and bat colonies yields key palaeo-environmental and fossil evidence."
    }
  ];

  /* ============================================================
     4. DOM REFERENCES + APP STATE
     ============================================================ */
  const mapSvg      = document.getElementById('botswana-map');
  const mapFrame    = document.getElementById('mapFrame');
  const markerLayer = document.getElementById('markerLayer');
  const stage       = document.getElementById('stage');
  const legendList  = document.getElementById('legendList');
  const legendTotal = document.getElementById('legendTotal');
  const infoPanel   = document.getElementById('infoPanel');
  const infoInner   = document.getElementById('infoInner');
  const legendToggle= document.getElementById('legendToggle');
  const legend      = document.getElementById('legend');

  let activeBtn   = null;   // marker button currently selected
  let activeSite  = null;
  let activeCat   = null;   // null = show everything

  /* ============================================================
     5. VIEWBOX HANDLING + LAND GRADIENT
     ============================================================ */
  function readViewBox() {
    const raw = (mapSvg.getAttribute('viewBox') || '').trim().split(/[\s,]+/).map(Number);
    if (raw.length === 4 && raw.every(Number.isFinite) && raw[2] > 0 && raw[3] > 0) {
      viewBox = { x: raw[0], y: raw[1], w: raw[2], h: raw[3] };
    } else {
      const w = parseFloat(mapSvg.getAttribute('width'))  || DEFAULT_VB_W;
      const h = parseFloat(mapSvg.getAttribute('height')) || DEFAULT_VB_H;
      viewBox = { x: 0, y: 0, w: w, h: h };
      mapSvg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    }
  }

  /** Injects the shared sand gradient used by every land path. */
  function ensureDefs() {
    let defs = mapSvg.querySelector('defs[data-heritage="1"]');
    if (!defs) {
      defs = document.createElementNS(SVG_NS, 'defs');
      defs.setAttribute('data-heritage', '1');
      mapSvg.insertBefore(defs, mapSvg.firstChild);
    }
    defs.innerHTML =
      '<linearGradient id="landGrad" gradientUnits="userSpaceOnUse" ' +
        'x1="' + viewBox.x + '" y1="' + viewBox.y + '" ' +
        'x2="' + (viewBox.x + viewBox.w * 0.8) + '" ' +
        'y2="' + (viewBox.y + viewBox.h) + '">' +
        '<stop offset="0" stop-color="#ecd8b4"/>' +
        '<stop offset="0.5" stop-color="#dcc094"/>' +
        '<stop offset="1" stop-color="#c8a675"/>' +
      '</linearGradient>';
  }

  /* ============================================================
     6. RESPONSIVE MAP FRAME
     ------------------------------------------------------------
     The frame is sized to the SVG's exact aspect ratio, so percentage
     positioning of markers maps 1:1 onto rendered SVG pixels.
     ============================================================ */
  function fitFrame() {
    const cs = getComputedStyle(stage);
    const availW = stage.clientWidth
      - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const availH = stage.clientHeight
      - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);

    if (availW <= 0 || availH <= 0) return;

    const ar = viewBox.w / viewBox.h;
    let w = availW;
    let h = w / ar;
    if (h > availH) { h = availH; w = h * ar; }

    mapFrame.style.width  = Math.floor(w) + 'px';
    mapFrame.style.height = Math.floor(h) + 'px';
  }

  /* ============================================================
     7. MARKER RENDERING
     ------------------------------------------------------------
     Markers are absolutely-positioned <button>s living in the HTML
     layer above the SVG — never inside it — so they keep a constant
     on-screen size and a 44×44px tap target at any map scale.
     ============================================================ */
  function renderMarkers() {
    markerLayer.innerHTML = '';

    SITES.forEach(function (site, i) {
      const cat = CATEGORIES[site.category] || CATEGORIES.museum;

      // Project, then apply per-axis overrides if supplied.
      const projected = project(site.lat, site.lng);
      const svgX = (site.x != null) ? site.x : projected.x;
      const svgY = (site.y != null) ? site.y : projected.y;

      // Convert SVG user units → percentage of the viewBox.
      const pctX = ((svgX - viewBox.x) / viewBox.w) * 100;
      const pctY = ((svgY - viewBox.y) / viewBox.h) * 100;

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'marker';
      btn.dataset.siteId = site.id;
      btn.dataset.category = site.category;
      btn.style.left = pctX.toFixed(4) + '%';
      btn.style.top  = pctY.toFixed(4) + '%';
      btn.style.setProperty('--c', cat.color);
      btn.style.animationDelay = (i * 45) + 'ms';
      btn.setAttribute('aria-label', site.name + ' — ' + cat.label);
      btn.setAttribute('aria-expanded', 'false');
      btn.innerHTML =
        '<span class="marker-inner">' + ICONS[site.category] + '</span>';

      /* --- marker → info panel binding ------------------------- */
      btn.addEventListener('click', function (ev) {
        ev.stopPropagation();
        if (activeBtn === btn) { return; }
        openInfo(site, btn);
      });

      markerLayer.appendChild(btn);
    });

    applyCategoryFilter();
  }

  /* ============================================================
     8. INFO PANEL
     ============================================================ */
  function escapeHTML(str) {
    return String(str).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function formatCoord(lat, lng) {
    const ns = lat >= 0 ? 'N' : 'S';
    const ew = lng >= 0 ? 'E' : 'W';
    return Math.abs(lat).toFixed(4) + '° ' + ns + '  ·  ' +
           Math.abs(lng).toFixed(4) + '° ' + ew;
  }

  function openInfo(site, btn) {
    const cat = CATEGORIES[site.category] || CATEGORIES.museum;

    if (activeBtn && activeBtn !== btn) {
      activeBtn.classList.remove('is-active');
      activeBtn.setAttribute('aria-expanded', 'false');
    }

    activeBtn  = btn;
    activeSite = site;
    btn.classList.add('is-active');
    btn.setAttribute('aria-expanded', 'true');

    infoInner.innerHTML =
      '<span class="info-pill" style="background:' + cat.color + '">' +
        escapeHTML(cat.label) + '</span>' +
      '<h2>' + escapeHTML(site.name) + '</h2>' +
      '<p class="info-desc">' + escapeHTML(site.description) + '</p>' +
      '<p class="info-meta">' + formatCoord(site.lat, site.lng) + '</p>';
  }

  function closeInfo(restoreFocus) {
    const btn = activeBtn;
    if (btn) {
      btn.classList.remove('is-active');
      btn.setAttribute('aria-expanded', 'false');
    }
    activeBtn = null;
    activeSite = null;
    infoInner.innerHTML = '<p class="info-instruction">Tap a marker on the map to see details about a heritage site.</p>';
    if (restoreFocus && btn) btn.focus({ preventScroll: true });
  }

  /* ============================================================
     9. LEGEND + CATEGORY FILTER
     ============================================================ */
  function renderLegend() {
    legendList.innerHTML = Object.keys(CATEGORIES).map(function (key) {
      const cat = CATEGORIES[key];
      const count = SITES.filter(function (s) { return s.category === key; }).length;
      return (
        '<li>' +
          '<button class="legend-item" type="button" data-cat="' + key + '" ' +
                  'aria-pressed="false">' +
            '<span class="legend-ico" style="--c:' + cat.color + '">' +
              ICONS[key] + '</span>' +
            '<span class="legend-label">' + escapeHTML(cat.label) + '</span>' +
            '<span class="legend-count">' + count + '</span>' +
          '</button>' +
        '</li>'
      );
    }).join('');

    legendTotal.textContent = SITES.length + ' heritage sites mapped';

    legendList.addEventListener('click', function (ev) {
      const btn = ev.target.closest('.legend-item');
      if (!btn) return;
      const cat = btn.dataset.cat;
      activeCat = (activeCat === cat) ? null : cat;

      legendList.querySelectorAll('.legend-item').forEach(function (el) {
        el.setAttribute('aria-pressed', String(el.dataset.cat === activeCat));
      });
      applyCategoryFilter();
    });
  }

  function applyCategoryFilter() {
    markerLayer.querySelectorAll('.marker').forEach(function (m) {
      const dim = activeCat !== null && m.dataset.category !== activeCat;
      m.classList.toggle('is-dimmed', dim);
    });
  }

  /* ============================================================
     10. MAP LOADING (inline SVG — no file picker needed)
     ============================================================ */
  function hasGeometry() {
    return !!mapSvg.querySelector('path, polygon, polyline, g, circle, rect, ellipse');
  }

  function afterMapLoaded() {
    readViewBox();
    ensureDefs();
    renderLegend();
    fitFrame();
    renderMarkers();
  }

  /* ============================================================
     11. GESTURES — pinch zoom, pan, wheel zoom
     ============================================================ */
  var zoom = 1, panX = 0, panY = 0;
  var MIN_ZOOM = 1, MAX_ZOOM = 4;
  var isPanning = false, isPinching = false;
  var lastTouchX = 0, lastTouchY = 0, lastTouchDist = 0;
  var mouseDown = false, lastMouseX = 0, lastMouseY = 0;

  function applyTransform() {
    mapFrame.style.transform = 'translate(' + panX + 'px,' + panY + 'px) scale(' + zoom + ')';
    mapFrame.style.transformOrigin = '50% 50%';
    // Counter-scale markers so they shrink as the map zooms in.
    var inv = 1 / zoom;
    var markers = markerLayer.querySelectorAll('.marker');
    for (var i = 0; i < markers.length; i++) {
      markers[i].style.transform = 'translate(-50%, -50%) scale(' + inv + ')';
    }
  }

  function clampPan() {
    var rect = mapFrame.getBoundingClientRect();
    var stageRect = stage.getBoundingClientRect();
    var maxX = Math.max(0, (rect.width - stageRect.width) / 2);
    var maxY = Math.max(0, (rect.height - stageRect.height) / 2);
    panX = Math.min(maxX, Math.max(-maxX, panX));
    panY = Math.min(maxY, Math.max(-maxY, panY));
  }

  function touchDist(t1, t2) {
    var dx = t1.clientX - t2.clientX;
    var dy = t1.clientY - t2.clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }

  stage.addEventListener('touchstart', function (e) {
    if (e.touches.length === 1) {
      isPanning = true;
      lastTouchX = e.touches[0].clientX;
      lastTouchY = e.touches[0].clientY;
    } else if (e.touches.length === 2) {
      isPinching = true;
      isPanning = false;
      lastTouchDist = touchDist(e.touches[0], e.touches[1]);
    }
  }, { passive: true });

  stage.addEventListener('touchmove', function (e) {
    if (isPinching && e.touches.length === 2) {
      e.preventDefault();
      var d = touchDist(e.touches[0], e.touches[1]);
      var scale = d / lastTouchDist;
      zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * scale));
      lastTouchDist = d;
      applyTransform();
    } else if (isPanning && e.touches.length === 1) {
      e.preventDefault();
      var dx = e.touches[0].clientX - lastTouchX;
      var dy = e.touches[0].clientY - lastTouchY;
      panX += dx;
      panY += dy;
      lastTouchX = e.touches[0].clientX;
      lastTouchY = e.touches[0].clientY;
      clampPan();
      applyTransform();
    }
  }, { passive: false });

  stage.addEventListener('touchend', function (e) {
    if (e.touches.length < 2) isPinching = false;
    if (e.touches.length < 1) isPanning = false;
  }, { passive: true });

  stage.addEventListener('mousedown', function (e) {
    mouseDown = true;
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
  });

  document.addEventListener('mousemove', function (e) {
    if (!mouseDown) return;
    var dx = e.clientX - lastMouseX;
    var dy = e.clientY - lastMouseY;
    panX += dx;
    panY += dy;
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
    clampPan();
    applyTransform();
  });

  document.addEventListener('mouseup', function () { mouseDown = false; });

  stage.addEventListener('wheel', function (e) {
    e.preventDefault();
    var delta = e.deltaY > 0 ? 0.9 : 1.1;
    zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * delta));
    clampPan();
    applyTransform();
  }, { passive: false });

  /* ============================================================
     12. GLOBAL INTERACTIONS
     ============================================================ */
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeInfo(true);
  });

  // Legend toggle
  legendToggle.addEventListener('click', function () {
    var open = legend.hasAttribute('hidden');
    if (open) {
      legend.removeAttribute('hidden');
      legendToggle.setAttribute('aria-expanded', 'true');
      legendToggle.textContent = 'Categories \u25b4';
    } else {
      legend.setAttribute('hidden', '');
      legendToggle.setAttribute('aria-expanded', 'false');
      legendToggle.textContent = 'Categories \u25be';
    }
  });

  // Keep the frame correct on resize / orientation change.
  var rafId = 0;
  function onResize() {
    cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(function () {
      fitFrame();
      applyTransform();
    });
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', onResize);

  if ('ResizeObserver' in window) {
    new ResizeObserver(fitFrame).observe(stage);
  }

  /* ============================================================
     13. INIT
     ============================================================ */
  function init() {
    afterMapLoaded();
  }

  init();
})();

/* Bottom navigation — this page is the "learn" tab. Other tabs return to the main app. */
function showTab(tab) {
  var btns = document.querySelectorAll('#bottomNav .navbtn');
  for (var i = 0; i < btns.length; i++) {
    btns[i].classList.toggle('active', btns[i].getAttribute('data-tab') === tab);
  }
  if (tab === 'learn') {
    return; // already on the map / learn page
  }
  window.location.href = '../index.html#' + tab;
}
</script>
</body>
</html>
