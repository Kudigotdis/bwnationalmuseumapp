  "sections": [
    {
      "heading": "Introduction: The Rites of Passage into Adulthood",
      "content": [
        "Among the Tswana people of Botswana, initiation ceremonies—bogwera for boys and bojale for girls—were historically the most important rites of passage marking the transition from childhood to adulthood. These ceremonies were not mere rituals; they were comprehensive educational, social, and spiritual experiences that transformed children into responsible adults equipped with the knowledge, skills, and values necessary to participate fully in Tswana society.",
        "Taking place over several months, bogwera and bojale were required before one's adulthood was recognised. Without undergoing these ceremonies, a person could not marry, could not inherit property, could not serve in the tribal council (kgotla), and was not considered a full member of the community. The ceremonies were the gateways to full citizenship and social responsibility.",
        "The arrival of European missionaries in the 19th century led to the decline of these practices, as missionaries opposed them and worked to ban them, replacing initiation schools with mission schools. However, in recent decades, there has been a revival of interest in bogwera and bojale as part of cultural preservation efforts, and bojale for girls of Bakgatla ba Kgafela communities is now recognised by UNESCO as an important intangible cultural heritage."
      ]
    },
    {
      "heading": "The Philosophy Behind Initiation",
      "children": [
        {
          "heading": "Becoming an Adult",
          "content": [
            "The philosophy behind initiation ceremonies is that a child must be educated before they can be considered an adult. This education was not merely academic but holistic—it covered physical, moral, social, and spiritual dimensions of life."
          ]
        },
        {
          "heading": "Separation and Transformation",
          "content": [
            "Initiation involved a ritual separation from the ordinary world. Initiates were taken to secluded locations—often in the bush or in specially constructed lodges—away from their families and communities. This separation symbolised the death of childhood and the birth of adulthood. During this period of seclusion, initiates underwent physical challenges, learned sacred knowledge, and were transformed into new social beings."
          ]
        },
        {
          "heading": "Transmission of Cultural Knowledge",
          "content": [
            "Initiation schools were the primary institutions for the transmission of Tswana history, religion, cosmology, and ethics. In these schools, initiates learned:",
            {
              "type": "list",
              "items": [
                "The history and lineage of their tribe",
                "The customs and laws of their people",
                "Proper behaviour toward elders and royalty",
                "The rights and responsibilities of adults",
                "Topics relating to sexual intercourse and marriage",
                "The values of obedience, respect, and community solidarity"
              ]
            }
          ]
        }
      ]
    },
    {
      "heading": "Bogwera: The Boys' Initiation Ceremony",
      "children": [
        {
          "heading": "The Meaning of Bogwera",
          "content": [
            "Bogwera (also known as bogwera or mophato in some dialects) is the traditional initiation ceremony into manhood. The word itself is derived from the verb go gwera, meaning 'to be initiated' or 'to undergo the rites of passage.'"
          ]
        },
        {
          "heading": "The Process of Bogwera",
          "children": [
            {
              "heading": "1. Circumcision",
              "content": [
                "Bogwera began with circumcision—the physical mark of the transition from boyhood to manhood. Circumcision was not merely a medical procedure but a profound ritual act. It symbolised the removal of childhood impurities and the preparation of the body for adult responsibilities. The operation was performed by skilled elders using traditional implements, and the initiate was expected to endure the pain without flinching—a test of courage and endurance."
              ]
            },
            {
              "heading": "2. Seclusion and Education",
              "content": [
                "After circumcision, the initiates were brought to a secluded camp in the wilderness, often in the cold of winter. Here, they lived apart from their families for several months, under the strict supervision of appointed elders and instructors.",
                "During this period, initiates learned:",
                {
                  "type": "list",
                  "items": [
                    "Herding and cattle management – essential skills for a Tswana man, as cattle were the foundation of wealth and status",
                    "Hunting techniques – tracking, stalking, and killing game",
                    "Warfare and self-defence – fighting with spears, clubs, and shields",
                    "Survival skills – finding water, making fire, identifying edible plants",
                    "Tribal history and genealogy – memorising the lineage of chiefs and the deeds of ancestors",
                    "Proverbs and wisdom sayings – the ethical teachings of the elders",
                    "Ritual knowledge – the sacred songs, dances, and ceremonies of the tribe"
                  ]
                }
              ]
            },
            {
              "heading": "3. Physical Challenges",
              "content": [
                "The initiates underwent rigorous physical challenges designed to test their endurance, discipline, and courage. These included:",
                {
                  "type": "list",
                  "items": [
                    "Enduring cold and hunger",
                    "Performing demanding physical labour",
                    "Participating in mock battles and hunting expeditions",
                    "Running long distances",
                    "Withstanding painful rituals"
                  ]
                },
                "These challenges were not sadistic but pedagogical—they were meant to build character, forge bonds of brotherhood among the initiates, and prepare young men for the hardships of adult life."
              ]
            },
            {
              "heading": "4. Praise Poems",
              "content": [
                "Each boy participating in bogwera in the 19th century was required to write a praise poem (leboko) about himself. These praise poems were a form of self-definition and self-promotion. They recounted the boy's lineage, his courage, his achievements, and his aspirations. The praise poem was recited publicly at the conclusion of the initiation, marking the boy's emergence as a man.",
                {
                  "type": "poem",
                  "lines": [
                    "Ke morwa ga Mokgosi,",
                    "Ke tsene bogwereng jaaka tau,",
                    "Ga ke boife loso,",
                    "Ke tla nna monna ka matla."
                  ],
                  "translation": "I am the son of Mokgosi, I entered initiation like a lion, I do not fear death, I will be a man of strength."
                }
              ]
            },
            {
              "heading": "5. Graduation and Return",
              "content": [
                "At the conclusion of the initiation period, the initiates underwent a graduation ceremony in which they were formally declared adults. They returned to their communities as new men—reborn, transformed, and ready to take on adult responsibilities. They were now eligible to:",
                {
                  "type": "list",
                  "items": [
                    "Marry and start a family",
                    "Participate in the kgotla (tribal council)",
                    "Inherit property",
                    "Serve in the army",
                    "Hold positions of leadership"
                  ]
                }
              ]
            }
          ]
        }
      ]
    },
    {
      "heading": "Bojale: The Girls' Initiation Ceremony",
      "children": [
        {
          "heading": "The Meaning of Bojale",
          "content": [
            "Bojale is the traditional initiation ceremony for girls into womanhood, typically performed after a girl reached puberty. The ceremony is also known as bojale or mophato in some dialects."
          ]
        },
        {
          "heading": "The Process of Bojale",
          "children": [
            {
              "heading": "1. Preparation and Seclusion",
              "content": [
                "When a girl reached puberty, she was taken to a secluded location—often a special lodge or a secluded area of the village—where she would live apart from her family and community for a period of several months. During this time, she was under the supervision of older women, who served as instructors and mentors."
              ]
            },
            {
              "heading": "2. Education and Training",
              "content": [
                "Girls in bojale were taught:",
                {
                  "type": "list",
                  "items": [
                    "Domestic skills – cooking, cleaning, and managing a household",
                    "Agriculture – planting, tending, and harvesting crops",
                    "Childcare – how to care for infants and young children",
                    "Marital duties – how to be a good wife and mother",
                    "Sexual knowledge – topics relating to sexual intercourse, pregnancy, and childbirth",
                    "Tribal customs – the history, traditions, and laws of their people",
                    "Ethics and morality – proper behaviour, respect for elders, and community values",
                    "Ritual knowledge – the sacred songs, dances, and ceremonies of the tribe"
                  ]
                }
              ]
            },
            {
              "heading": "3. The Symbolism of the Drum",
              "content": [
                "Bojale may incorporate the use of an open drum that is meant to symbolise a womb and birth canal. This drum is central to the ritual and is known as Moropa wa Bojale ba Bakgatla ba Kgafela. The drum's open shape represents the passage from childhood to womanhood, just as the birth canal represents the passage from the womb to the world."
              ]
            },
            {
              "heading": "4. No Female Genital Cutting",
              "content": [
                "Contrary to some reports and misconceptions, no female genital mutilation or cutting took place during bojale. This is an important distinction. Bojale was an educational and ritual process, not a surgical one."
              ]
            },
            {
              "heading": "5. Graduation and Return",
              "content": [
                "At the conclusion of the initiation period, the girls underwent a graduation ceremony and returned to their communities as adult women. They were now eligible to:",
                {
                  "type": "list",
                  "items": [
                    "Marry and start a family",
                    "Manage their own households",
                    "Participate in women's community organisations",
                    "Serve as mentors and instructors for future initiates"
                  ]
                }
              ]
            }
          ]
        }
      ]

  "subtitle": "The Transition from Elder to Ancestor",
  "introduction": "Among the Tswana people of Botswana, death is not an end but a transformation. When one dies, they 'graduate' from being an elder to being an ancestor. This profound belief shapes every aspect of Tswana funeral rites, elevating them from mere ceremonies of grief to sacred rituals of transition that connect the living with the spiritual realm. Because the Tswana believe in ancestral spirits (badimo), funerals are of paramount importance in their culture. The funeral is the primary forum in which people enact core values of caring and love for each other and build mutual connections. Funerals are elaborate affairs that can last a full week, involving the entire community in a complex web of rituals, obligations, and expressions of solidarity. The Tswana funeral is a rite of passage that offers resolution and closure, but it is also an intensely social event where identities and selfhood are shared across bodies and selves through sentiments and material acts. It is a time when the community comes together to honour the departed, support the bereaved, and reaffirm the bonds that hold society together.",

  "Botswnana_Marriage_Customs": {
  "title": "Marriage Customs in Botswana",
  "subtitle": "RESPONSE 8 OF 15",
  "sections": [
    {
      "heading": "Introduction: Marriage as a Communal Foundation",
      "content": "In Tswana culture, marriage (lenyalo) is far more than a union between two individuals—it is a sacred covenant between families, clans, and communities. It is the institution through which lineages are continued, alliances are forged, wealth is transferred, and social order is maintained. Marriage was historically the most significant rite of passage in a person's life, marking the transition from youth to full adult status and social responsibility.\n\nThe philosophy underpinning Tswana marriage is rooted in botho/ubuntu—the principle that a person is a person through other people. As scholars have observed, marriage among Batswana was not an individual affair but reflected how the 'communities involved shared their very existence in that reality and how they became one people, one thing'. Through marriage, families and clans are united so that what is done to one member is done to all. Marriage created mutual relationships between families, forming 'networks of alliance and support on both sides of the family'.\n\nClassic anthropological work on Tswana marriage emphasises that it is a process of becoming, involving a series of rituals and prestations characterised by a long period of socially productive ambiguity. The status of the union, the spouses, their children, and their broader families remain uncertain for some time, and the marriage is only fully legitimised through the completion of all rituals."
    },
    {
      "heading": "The General Tswana Marriage Process",
      "content": "While practices vary among tribes, a general sequence of events characterises Tswana marriage across all groups.",
      "subsections": [
        {
          "heading": "1. Courtship and Choosing a Partner (Go Kokota / Go Itshupa)",
          "content": "Unlike some other southern African groups where families arrange marriages, BaTswana are trusted to start their own relationships. Young men and women are free to choose their partners, though families play a crucial role in approving and formalising the union.\n\nIn pre-colonial times, there were some practices and restrictions on the choice of a woman and the family into which a man could marry. A man could marry his cousin, or ntsala, who happened to be the 'daughter of a maternal uncle or a paternal aunt'. However, marriage within the same totem (seboko) was strictly forbidden, as this would violate the exogamy rules central to Tswana social organisation.\n\nThe Batswana people call for a declaration of one's interest in a specific future bride: 'Go tlhoma letlhokwa'. The parents of a male would sometimes earmark a very young baby girl, and in some rare instances even a girl who has not yet been born, as a potential future wife for their son. The parents are always guided by family ties."
        },
        {
          "heading": "2. The Letter of Intent",
          "content": "When a young man is ready for marriage, his family writes a letter and sends delegates to the bride's family explaining that they have seen a girl and would like to pay magadi for her. This formal declaration of intent is a crucial first step that signals the seriousness of the groom's family and their respect for the bride's family.\n\nThe girl's family will then reply and accept the proposal, also giving them a date to come and negotiate magadi. This response is not automatic—the bride's family must be satisfied that the groom's family is suitable and that the match is appropriate."
        },
        {
          "heading": "3. The Role of the Maternal Uncle (Malome)",
          "content": "In Setswana societies, the maternal uncle (malome) played an important role in handling disputes within the family and also in marriage negotiations. Maternal uncles (bomalome) were instrumental in the negotiations of Patlo or 'seeking' the woman from her parents.\n\nThe uncle's role is so significant that in the modern wedding ceremony, the head of the slaughtered cow is always reserved for the malome. Before the wedding, the malome takes the bride shopping for her wedding outfit."
        },
        {
          "heading": "4. Patlo: Seeking the Woman's Hand",
          "content": "Patlo is a social process of negotiating or seeking the hand of a woman in marriage. This is the formal negotiation phase where the two families come together to discuss the proposed union.\n\nThe man's father would informally have a dialogue or conversation with the father of the woman his son intended to marry to establish some kind of relationship between the two families. After the fathers' meeting, a discussion about the possibility of marriage among close relatives would ensue.\n\nThe maternal uncles approached the girl's parents through the following expression: 'Re tsile go kopa sego sametsi'—'we have come to request a calabash (gourd) of water'. The metaphor of 'sego sa metsi' or a gourd of water referred to the fact that a woman is linked with life-giving flowing water, and thus with fertility. Rhetorically, the metaphor also designates her domestic role as one who will carry water from the well for her family. A successful Patlo ended with a betrothal."
        },
        {
          "heading": "5. Bogadi / Magadi: The Bride Wealth",
          "content": "Lobola in Tswana is referred to as Bogadi or Magadi. It is seen as a token of pledge, commitment, and appreciation from deep within to the family of the woman whom a man intends to marry.\n\nAccording to Richard Letsholo, the Batswana communities refer to bogadi as a social practice that signals an important rite of passage: a preparation for married life. The Batswana people equate bogadi to cattle as the word means an 'offer'. In essence, bogadi is a confirmation that the man is indeed happy and satisfied that another family or clan has given birth to a wife for him.\n\nKey aspects of Bogadi:\n- Not a sale: The practice is not a sale transaction. It does not mean that a woman is sold to a man, as this could later create problems.\n- Encourages loyalty: Bogadi is a practice that encourages loyalty in marriage and serves as a reminder to the husband that his wife has to be protected and cared for at all times.\n- Legal legitimisation: The lobola is definitely a legitimising bond—without it, no marriage is considered legal. In the event of a dissolution, the first question will be whether the cattle have been paid.\n- For the children: In the Setswana custom, the giving of bogadi was for the children, and that included for their mother.\n- Reduction for prior children: If the bride came with children from another man, the lobola was reduced during negotiations to appreciate the bride's devaluation.\n- Full payment: Traditionally, magadi is paid in full at once. The date for payment is always set for Friday.\n\nTraditional offering: Traditionally, the offering has been in the form of cattle and it varied from place to place, family to family and clan to clan as to how many cattle would be offered. Back then, the minimum was four cows; if the groom could not afford at least four cows, he would be sent back home and told to come back when he could afford to pay magadi."
        },
        {
          "heading": "6. Go Laya: Premarital Counselling",
          "content": "Go laya is a process of premarital ritual advice or counselling. During this phase, the elderly women and men give the bride and groom tips on how to run a home and what marriage is. This counselling emphasises the importance of marriage and the commitment that comes with it.\n\nThe groom's aunts request to meet the bride and then tell her about her husband's family practices and how to be a good wife."
        },
        {
          "heading": "7. The Wedding Ceremony (Kemo / Mokete wa Lenyalo)",
          "content": "The wedding ceremony itself is a multi-day affair rich with ritual and symbolism.\n\nThe Friday (Payment Day):\n- The delegates arrive at the bride's house early in the morning, usually at 5am.\n- Only men were allowed to pay and accept magadi; women are only called in to witness that the magadi is paid in full.\n- A big celebration is thrown for the two families to meet each other, with the groom also in attendance.\n\nThe Saturday (White Wedding):\n- The couple has a white wedding.\n- They slaughter a cow and cook all the meat except for its head, as it is always reserved for malome.\n- Before leaving, the groom is expected to buy bedding for his wife.\n- Later that night, the groom will come and sleep in the new hut at the bride's home.\n\nThe Sunday (Welcoming the Bride):\n- The groom has to wake up early in the morning before the bride's family sees him and goes back to his home.\n- At his home, there will be another wedding, welcoming the bride to the groom's house.\n- The bride wears the clothes malume bought her and then later changes to her traditional outfit: a white shirt, black shoes, head wrap and letoise (traditional skirt)."
        },
        {
          "heading": "8. Go Isa Monyadiwa: Transfer of the Bride",
          "content": "The formal lenyalo processes include the transfer of a bride to her in-laws (go isa monyadiwa) and the bride being taken back to her natal home (go gatisiwa). This back-and-forth movement symbolises the ongoing connection between the two families and the gradual integration of the bride into her new family."
        },
        {
          "heading": "9. The Motlhakanelwa Beast",
          "content": "One particular event that has remained relevant is the handling and sharing of the motlhakanelwa beast. Kgomo ya motlhakanelwa, the beast that is shared, is one of the most important cows in the Setswana wedding ceremony because of its ritualistic significance. It symbolises the sharing of resources, the unity of the two families, and the establishment of new kinship ties."
        }
      ]
    },
    {
      "heading": "The Wedding Song",
      "content": "After all is said and done, BaTswana sing:\n\n'dikuku di monate; lenyalo le boima; rona re a tsamaya'\n\nTranslation: 'The cake was nice; but marriage is hard; we are now leaving you two.'\n\nThis song acknowledges the joy of the celebration but also the serious responsibilities that marriage entails. It is a final blessing and a gentle warning to the newlyweds."
    },
    {
      "heading": "Variations by Tribe",
      "content": "While the core practices are similar across Tswana groups, there are important variations:",
      "subsections": [
        {
          "heading": "The Bakwena",
          "content": "The Bakwena, under the influence of Chief Sechele I's conversion to Christianity, saw some modifications to traditional marriage practices while maintaining the core bogadi system. The Bakwena evolved traditions that incorporated both Christian and traditional elements. However, like other Tswana groups, they maintained the importance of family consent and the payment of bogadi as essential to a legitimate marriage."
        },
        {
          "heading": "The Bangwato",
          "content": "The Bangwato traditionally placed great emphasis on cattle as the primary form of bogadi, reflecting their strong pastoral heritage. Marriage among the Bangwato was a system in which families came together and created through marriage networks of alliance and support on both sides of the family. In traditional Bangwato society, the consent of parents and bogadi were the two essentials of a Native marriage. Before Western contact, it was rather more than a mere consent of parents that was necessary; it was, in fact, a contractual agreement between the parents of the spouses."
        },
        {
          "heading": "The Bangwaketse",
          "content": "The Bangwaketse, who live predominantly in Kanye, have maintained strong traditional marriage practices. One distinctive feature is the ritual significance of the motlhakanelwa beast, which remains one of the most important elements of the Setswana wedding ceremony. Before a wedding, there is the bogadi, a bride price, usually paid to the bride's family in cows.\n\nTypes of Bangwaketse Marriages: The Bangwaketse recognise different types of marriages/weddings, each with its own processes and rites. The Bangwaketse's marriage rites are carefully structured and maintain ritual intensity."
        },
        {
          "heading": "The Batawana",
          "content": "The Batawana of Ngamiland had a distinctive marriage system that reflected their cattle-based economy and their geographical isolation. A bridegroom's family was required to transfer a bogadi (dowry) of cattle to his bride's family for marriage.\n\nA fascinating aspect of Batawana marriage was the practice of cousin marriage. A man would marry his cousins knowing that when his children in turn married their cousins, the cattle given for his wives would come back to him. This created a closed system of cattle circulation that reinforced family wealth and social cohesion."
        },
        {
          "heading": "The Bakgatla",
          "content": "Marriage is administered differently within ethnic groupings of Batswana, with each tribe observing and practising rituals and customs that are peculiar to it. The Bakgatla ba a Mocha have their own distinct marriage customs through different phases, from initiation, betrothal, the seeking of the hand of the woman in marriage, through to the wedding ceremony.\n\nThe Bakgatla-ba-ga-Kgafela have a rich tradition of wedding songs that address issues of gender. These songs are performed during the marriage process, the wedding celebration as a social and ritual event."
        },
        {
          "heading": "The Batlokwa",
          "content": "The Batlokwa have a distinctive practice regarding cousin marriage. While most Tswana groups practice marriage of maternal cousins, the Batlokwa prefer marrying their paternal cousins. This is an important distinction that reflects the unique kinship structures of this tribe.\n\nAmong the Batlokwa communities in Madikwe, two cattle were always offered, a bull and a cow, representing the two people who want to become partners. This symbolic offering reflects the balance and partnership that marriage represents."
        },
        {
          "heading": "The Balete",
          "content": "The Balete, a smaller morafe in Botswana's south-east, have their own marriage traditions. Wedding guests contribute to celebrations in cash or in kind, but seldom bring gifts of food they are served in feasts. Wedding practices in Botswana vary among its merafe, or 'tribes'."
        }
      ]
    },
    {
      "heading": "Polygamy in Tswana Marriage",
      "content": "Polygamy was traditionally practised among the Tswana, particularly among chiefs and wealthy men. A man with many cattle could afford to marry multiple wives, as each marriage required a substantial bride-wealth payment in cattle. Large polygynous households were a sign of high status and economic power.\n\nAmong the Basubiya (who are culturally related to the Tswana), polygamy was practised openly and proudly. One of the major reasons for practising polygamy was to curb infidelity, as the first wife would have to approve of her husband marrying a second wife.\n\nWith the arrival of Christianity, polygamy declined significantly, though it is still practised in some rural communities."
    },
    {
      "heading": "Legal Framework: Customary vs. Civil Marriage",
      "content": "In modern Botswana, there are two types of marriages or two ways of getting married:\n\nCustomary Marriages: Customary marriages are performed at a customary court ('kgotla') and require the approval of the local chief. These marriages are governed by customary law, which recognises the validity of bogadi as the legitimising bond. In customary law, it remains possible in principle for a man to marry multiple wives.\n\nMarriages Under the Act: Marriages under the Act are officiated by civil authorities and require registration with the National Registration (Omang) office. These marriages are governed by civil law, which is monogamous and follows the principles of common law.\n\nA common modern practice is for couples to perform the customary rituals such as Patlo and Magadi, which are sufficient to earn them a marriage certificate from the Kgosi, but then also go on to the District Commissioner, who uses Common Law. This dual approach allows couples to honour their cultural traditions while also securing the legal protections of civil marriage."
    },
    {
      "heading": "Modern Changes and Continuities",
      "content": "The Impact of Urbanisation and Education: Urbanisation has led to smaller, simpler ceremonies. Many couples now choose civil marriages alongside or instead of traditional ceremonies. However, the bogadi system remains central to Tswana identity and is still widely practised across all segments of society.\n\nThe 'Slow Marriage' and 'Fast Bogadi': Contemporary scholars have observed a phenomenon of 'slow marriage' and 'fast bogadi' in Botswana. Associated rituals occur over one or two days and bridewealth (bogadi) is usually given at the time of marriage. This time contraction in the rituals and prestations represents a significant change from the extended processes of the past.\n\nInstalments and the Modern Debate: In the modern context where bogadi often takes the form of money which can escalate into big amounts, there is ongoing debate about the practice. Some families now accept payment in instalments, though traditionalists insist that magadi should be paid in full at once.\n\nThe Debate on Bogadi: Bogadi remains a controversial subject because of the lack of understanding about it from people outside the cultural tradition. However, it has never been possible for the practice to be completely wished away. It even became more topical when the Nguni word lobola appeared to be common and almost representative of all other indigenous communities."

      "id": "folklore_1",
      "title": "The Story of the Crocodile and the Hare",
      "setswanaTitle": null,
      "story": "Long ago, the crocodile invited all the animals to a great feast beneath the waters of the river. The crocodile promised that it would be a magnificent celebration with the finest food and music. All the animals were excited—except for the hare. The hare was suspicious, for he knew that crocodiles were not to be trusted.\n\n\"I am feeling unwell,\" the hare told the other animals. \"I cannot attend.\"\n\nThe crocodile, upon hearing this, insisted that the hare must come. \"You cannot miss this feast!\" the crocodile declared. \"What will the other animals think if you are absent? I will send my brothers to escort you.\"\n\nSeeing no way to refuse without insulting the crocodile, the hare thought quickly. He said to the crocodile, \"Very well, I will come. But I will bring my drum with me, and I will play it to entertain the guests. It is the most beautiful drum in all the land, and everyone will want to hear it.\"\n\nThe crocodile agreed, and the hare arrived at the feast carrying his drum. As the animals gathered beneath the water, the hare began to play his drum—but he was not playing it as a musician. Instead, he placed the drum on the surface of the water, climbed onto it, and used it as a float to escape across the river.\n\nThe crocodile and his brothers were furious. They lunged after the hare, but the clever hare was already too far away. He paddled to the far shore and called back:\n\n\"You thought you could trick me, Crocodile! I may be small, but I am not foolish!\"",
      "moral": "Intelligence and cunning can overcome brute strength. Size and power are not everything; wisdom and quick thinking are equally valuable. The story also teaches children to be cautious of those who seem too friendly.",
      "culturalSignificance": "This story reinforces the value of wit over strength, a common theme in Tswana folklore. It teaches children to be discerning and not to trust appearances."

      "title": "The Greedy Hyena",
      "setswanaTitle": null,
      "story": "One day, a lion made a kill—a large, fat wildebeest. The lion settled down to eat, but soon the hyena arrived, drawn by the scent of fresh meat.\n\n\"Lion,\" said the hyena, \"you are the king of the animals. Surely you do not need to eat all of this meat yourself. You should share with your friends.\"\n\nThe lion was annoyed, but he was generous. He gave the hyena a generous portion of the meat. The hyena ate it quickly and then came back for more.\n\n\"Lion,\" said the hyena, \"I am still hungry. Surely you can spare a little more.\"\n\nThe lion gave the hyena more meat. Again, the hyena ate it quickly and returned.\n\nThis happened several times until the lion's kill was almost completely eaten—and most of it had gone to the hyena.\n\n\"You are greedy,\" the lion growled. \"You have taken more than your fair share. Leave before I become angry.\"\n\nThe hyena laughed. \"What will you do, Lion? You have already given me the meat. It is mine now.\"\n\nThe lion realised that the hyena was right—he had been too generous, and now he had almost nothing left for himself. He had learned a hard lesson about the dangers of excessive generosity and the nature of the greedy.",

      "id": "folklore_3",
      "title": "Why the Tortoise Has a Cracked Shell",
      "setswanaTitle": null,
      "story": "In the time before the stars were fixed in the sky, the tortoise was the messenger of the gods. He was trusted to carry important messages between the world of the spirits and the world of humans.\n\nOne day, the gods gave the tortoise a very important message to deliver to the humans below. \"Tortoise,\" said the gods, \"this message is urgent. You must deliver it without delay.\"\n\nThe tortoise set off with the message, but along the way, he grew tired and hungry. He came upon a tree laden with delicious fruit, and he could not resist. He set down the message and climbed the tree, eating his fill.\n\nWhile he was eating, the wind blew the message away, and it was lost. When the tortoise returned to the place where he had left the message, it was gone. He searched everywhere, but the message was nowhere to be found.\n\nWhen the gods asked for the reply to their message, the tortoise had nothing to give them. He had failed in his duty.\n\nThe gods were furious. \"You have failed us, Tortoise!\" they thundered. \"Your carelessness has caused a catastrophe among the humans!\"\n\nThey seized the tortoise and threw him from the sky. The tortoise fell to the earth, and his shell shattered upon impact. The gods, in their mercy, allowed the tortoise to live, but his shell never healed fully—which is why tortoises have patterned shells, with the cracks still visible.",

      "id": "folklore_4",
      "title": "The Sun and the Moon",
      "setswanaTitle": null,
      "story": "Long ago, when the world was young, the Sun and the Moon were siblings. The Sun was proud, hot-tempered, and boastful. He shone with blinding brightness and expected everyone to bow before him. The Moon was gentle, calm, and modest. She shone with a soft, silvery light that was pleasant to all.\n\nThe Sun would often boast: \"I am the greatest of all the heavenly bodies! Without me, there would be no light, no warmth, no life. I am the most important, the most powerful, the most magnificent!\"\n\nThe Moon would respond quietly: \"You are indeed powerful, my brother. But your brightness is sometimes too much. Your heat is sometimes too great.\"\n\nThe Sun grew angry at the Moon's words. \"What do you know?\" he shouted. \"You are only a pale reflection of my glory! You have no light of your own! Without me, you would be nothing!\"\n\nThe Moon wept at her brother's harsh words. She said, \"If that is how you feel, brother, then let us go before the gods and ask them to decide.\"\n\nThe Sun, confident in his power, agreed. When they appeared before the gods, the gods listened to both sides.\n\nThey said to the Sun: \"You are indeed bright, and you bring life to the earth. But your pride is your downfall. You believe that you are everything, and in your pride, you have hurt your own sister.\"\n\nTo the Moon they said: \"You are gentle and kind, and your light is a comfort to all. You see the value in others, and you do not boast.\"\n\nSo the gods decreed that the Sun and the Moon would rule the sky at different times. The Sun would rule by day, bringing his brightness and warmth. The Moon would rule by night, bringing her gentle light. But they would never meet—their paths would never cross—so that the Sun's pride would not be provoked and the Moon's gentleness would be preserved.\n\nThis is why the sun and the moon are never seen in the sky together—they were separated by the gods, a constant reminder of the dangers of pride and the value of humility.",

      "culturalSignificance": "This cosmological myth explains the separation of sun and moon while teaching the dangers of pride and the virtue of humility. It reinforces the cultural value of modesty."
    },

      "id": "folklore_5",
      "title": "The Boy Who Herded the Chief's Cattle",
      "setswanaTitle": null,
      "story": "There was once a poor boy whose parents had died, leaving him with nothing. He was taken in by relatives who treated him cruelly, forcing him to do the hardest work for the smallest reward.\n\nOne day, the chief sent word that he needed a diligent boy to herd his cattle. The boy's relatives volunteered him, thinking that if he failed, he would be punished.\n\nThe boy took the cattle out to graze, and he proved to be an excellent herdsman. He knew the best grazing areas, he kept the cattle safe from predators, and he never lost a single animal. During the dry season, he led the cattle to hidden water sources that only he knew about. During the rainy season, he kept them safe from lightning and flooding.\n\nOne night, a pride of lions attacked the cattle. While other boys would have run away, this boy stood his ground. He used his fire and his shouts to frighten the lions away. He saved the entire herd.\n\nThe chief, hearing of the boy's bravery and diligence, called him to his court. \"You have shown great courage and wisdom,\" the chief said. \"You have protected my cattle as if they were your own. I am going to reward you.\"\n\nThe chief gave the boy cattle of his own—ten cows and a strong bull. The boy's fortunes were transformed. He was no longer poor. He built a home of his own, and in time, he earned the respect of the community.\n\nThe boy's diligence also earned him the chief's attention. The chief had a beautiful daughter, and he gave her to the boy in marriage. The boy, who had once been the poorest of the poor, became a man of great wealth and status—all because of his honesty, hard work, and cleverness.\n\nThe boy became known throughout the land as a man of integrity. He was appointed as a trusted advisor to the chief, and he governed the people with justice and compassion.",
      "moral": "Diligence, honesty, and integrity are always rewarded, even when one starts with nothing. Those who are faithful in small things will be trusted with greater things. This story also reinforces the values of hard work and perseverance that are central to Tswana culture.",
      "culturalSignificance": "This is a classic rags-to-riches story that reinforces the Tswana values of hard work, diligence, and integrity. It teaches that one's circumstances do not determine one's future—character and effort do. It also emphasizes the importance of trustworthiness in leadership."

  "sections": [
    {
      "heading": "Introduction: A Nation of Many Tongues",
      "content": [
        "Botswana is often perceived as a monolingual nation, a country where everyone speaks Setswana. This perception, while reflecting the dominance of Setswana, obscures a far richer and more complex linguistic reality. Botswana is home to approximately 31 distinct languages, representing a diverse tapestry of Bantu and Khoisan language families. This linguistic diversity is not a mere curiosity; it is the living heritage of the country's many ethnic communities, each with its own history, culture, and identity.",
        "The linguistic landscape of Botswana is characterised by a steep hierarchy. At the top are English and Setswana, the only languages with official status and public functions. Below them are a range of minority Bantu languages, some with tens of thousands of speakers, and at the very bottom are the critically endangered Khoisan languages of the indigenous San (Basarwa) peoples, some of which are spoken by fewer than 500 people. Understanding this hierarchy is essential to understanding Botswana: its history, its politics, its education system, and the lived experiences of its citizens."

  "The_Bantu_Migration_into_Botswana": {
  "title": "The Bantu Migration into Botswana",
  "subtitle": "RESPONSE 1 OF 15",
  "sections": [
    {
      "heading": "Introduction: The Greatest Demographic Shift in Southern African History",
      "content": "The Bantu migration into what is now Botswana represents one of the most consequential demographic, linguistic, and cultural transformations in the entire history of southern Africa. It was not a single event but a gradual, multi-century movement of peoples that fundamentally reshaped the human landscape of the region. Before the Bantu arrived, Botswana was inhabited exclusively by hunter-gatherer peoples—the ancestors of today's San (Basarwa / Bushmen)—who had lived in the region for tens of thousands of years. The arrival of Bantu-speaking farming and herding communities set in motion processes of interaction, conflict, assimilation, and displacement that would ultimately create the ethnic and cultural mosaic that defines modern Botswana."
    },
    {
      "heading": "Origins of the Bantu Peoples",
      "content": "The term \"Bantu\" refers not to a single ethnic group but to a vast family of over 500 distinct languages spoken across much of sub-Saharan Africa, from Cameroon in the west to Kenya in the east and South Africa in the south. The proto-Bantu peoples—the ancestral population from whom all Bantu-speaking groups descend—are believed to have originated in the region of present-day Cameroon and Nigeria, specifically around the Benue River valley. Linguistic and archaeological evidence places their original homeland in this area, where they developed agriculture, pottery-making, and iron-working technology.\n\nFrom this homeland, the Bantu expansion—one of the largest human migrations in history—began sometime around 3000–2000 BCE. The expansion proceeded in multiple waves, moving eastward across the Congo Basin and then southward into the savannas and woodlands of Central, East, and Southern Africa. By about 500 CE, Bantu-speaking farmers had reached the northern borders of what is now South Africa."
    },
    {
      "heading": "The Routes into Botswana",
      "content": "The Bantu entered the territory of modern Botswana from at least two major directions:",
      "subsections": [
        {
          "heading": "The Western Route (via the Zambezi Valley)",
          "content": "The earliest Bantu arrivals into Botswana likely came from the north, moving down the Zambezi River valley and spreading into the Okavango Delta region. The Wayeyi (Bayei) people are widely considered by oral tradition and linguistic evidence to have been the first Bantu speakers to emigrate to the Okavango Delta, coming from Central Africa. They settled along the waterways of the Delta and established fishing and farming communities."
        },
        {
          "heading": "The Eastern Route (via the Limpopo Valley)",
          "content": "The other major route was through the Limpopo River valley, which flows along Botswana's eastern border with South Africa and Zimbabwe. The Bakgalagadi (Kgalagadi) are believed to have arrived in southern Africa more than 2,000 years ago together with other Bantu groups. They were among the earliest Sotho-Tswana groups to inhabit the Madikwe and Limpopo river basins between approximately 900 and 1000 CE. This eastern corridor was a major highway for the movement of peoples, goods, and ideas between the interior of southern Africa and the Indian Ocean coast."
        }
      ]
    },
    {
      "heading": "Archaeological Evidence in Botswana",
      "content": "Botswana contains some of the most important archaeological sites for understanding the Bantu migration in southern Africa.",
      "subsections": [
        {
          "heading": "Iron Smelting in the Tswapong Hills (c. 190 CE)",
          "content": "The earliest firmly dated Iron Age site in Botswana is an iron-smelting furnace discovered in the Tswapong Hills near Palapye in eastern Botswana. This furnace has been radiocarbon-dated to approximately 190 CE. It is almost certainly associated with early Iron Age farmers who had moved south from the Limpopo valley. The presence of iron-smelting technology is a hallmark of Bantu-speaking peoples—the San did not possess this technology prior to Bantu contact—and marks a clear archaeological signature of Bantu presence."
        },
        {
          "heading": "Early Iron Age Settlement at Molepolole (c. 420 CE)",
          "content": "Excavations near Molepolole, in southeastern Botswana, have revealed the remains of small, beehive-shaped houses made of grass matting, occupied by early Iron Age farmers. These structures have been dated to around 420 CE. The inhabitants of these settlements practiced agriculture, kept livestock, and produced iron tools. They represent some of the earliest known Bantu farming communities in what is now Botswana."
        },
        {
          "heading": "Tsodilo Hills (c. 550 CE)",
          "content": "Further west, in the Tsodilo Hills—a UNESCO World Heritage Site famous for its rock art—evidence of early farming settlement has been dated to about 550 CE. The Tsodilo Hills are located near the Okavango Delta, and their occupation suggests that Bantu farmers had by this time spread into northwestern Botswana, possibly in contact with the indigenous San hunter-gatherers who had lived in the hills for millennia. The interaction between Bantu farmers and San hunter-gatherers at Tsodilo is a fascinating subject, as the rock art includes both ancient San imagery and later Bantu motifs."
        }
      ]
    },
    {
      "heading": "The Bakgalagadi: The Earliest Sotho-Tswana Settlers",
      "content": "Among the earliest Bantu groups to establish themselves in Botswana were the Bakgalagadi (also spelled Bakgalagadi or Kgalagadi). Linguistic and historical evidence suggests they are one of the most ancient Sotho-Tswana groups in southern Africa. They are believed to have arrived in the region between 900 and 1000 CE, settling in the Madikwe and Limpopo river basins. Over time, some Bakgalagadi groups moved westward into the drier regions of the Kalahari, where they adapted to the harsh desert environment, developing unique subsistence strategies that combined small-scale agriculture, livestock herding, and wild food gathering.\n\nThe Bakgalagadi are significant because they represent the oldest stratum of Sotho-Tswana settlement in Botswana, predating the later arrivals that would form the major Tswana kingdoms (Bakwena, Bangwato, Bangwaketse, and Batawana). Their language and cultural practices retain features that are more archaic than those of the later Tswana groups, making them a living link to the earliest Bantu presence in the country."
    },
    {
      "heading": "The Wayeyi: First Bantu Speakers in the Okavango Delta",
      "content": "Oral traditions among the Wayeyi (Bayei) people of the Okavango Delta consistently identify them as the first Bantu speakers to settle in the Delta region. They trace their origins to Central Africa, likely migrating down the Zambezi and Chobe river systems before entering the Okavango's maze of waterways. The Wayeyi developed a culture intimately connected with water—they are renowned as skilled fishermen, boat-builders, and inhabitants of the Delta's seasonal floodplains.\n\nThe Wayeyi language, Shiyeyi, is a Bantu language that has been heavily influenced by contact with the indigenous San languages of the region, including the incorporation of click consonants—a rare feature in Bantu languages and a clear indicator of prolonged interaction between the Wayeyi and the San. Today, the Wayeyi are one of Botswana's minority ethnic groups, and their language has been largely supplanted by Setswana, though revitalisation efforts are underway."
    },
    {
      "heading": "The Technology that Transformed the Landscape",
      "content": "The Bantu migrants brought with them a package of technologies and economic practices that dramatically altered the human ecology of Botswana:",
      "subsections": [
        {
          "heading": "Iron-Working",
          "content": "The most transformative technology was iron metallurgy. Iron tools—hoes, axes, spears, and knives—were far more durable and efficient than the stone tools used by the San. Iron hoes allowed for the clearing of heavy bush and the tilling of hard soils, enabling the expansion of agriculture into areas that had been too difficult to cultivate with stone tools. Iron weapons also gave Bantu communities a significant military advantage over the San, though conflict was not always the primary mode of interaction."
        },
        {
          "heading": "Agriculture",
          "content": "The Bantu introduced cereal farming to Botswana, growing crops such as sorghum and millet—both highly drought-resistant grains well-suited to the semi-arid climate of much of the country. They also cultivated legumes and gourds. Agriculture provided a more reliable and concentrated food supply than hunter-gathering, supporting larger, more sedentary populations and enabling the growth of villages and, eventually, towns."
        },

      "heading": "Introduction: The Rise of the Great Merafe",
      "content": "The Tswana kingdoms—known in Setswana as merafe (singular: morafe)—represent the pinnacle of pre-colonial political organisation in what is now Botswana. These were not simple tribal groupings but sophisticated, centralised states with complex administrative systems, standing armies, extensive trade networks, and clearly defined territories. By the 19th century, the Tswana kingdoms controlled vast swathes of land stretching from the Limpopo River in the east to the Kalahari Desert in the west, and from the Molopo River in the south to the Chobe River in the north. Their political structures, cultural traditions, and economic systems laid the foundation for the modern nation-state of Botswana.\n\nThe story of the Tswana kingdoms is one of fission and fusion—of clans splitting apart, migrating, reconstituting themselves, and competing for resources and supremacy. It is also a story of resilience, as these kingdoms weathered the devastating storms of the Difaqane (Mfecane), European colonialism, and the pressures of modernisation, ultimately emerging as the dominant political force that negotiated a peaceful transition to independence in 1966."

0s), who defended his kingdom against Ndebele raids and Boer incursions. The Batawana became key allies of the British in the establishment of the Bechuanaland Protectorate, as their territory was strategically important for controlling the route to the Zambezi River.\n\nToday, the Batawana remain a politically and culturally significant group in Ngamiland, with their traditional capital at Maun, the gateway to the Okavango Delta. Their royal family still holds considerable influence."

async function fetchJSON(path) {
  // Try embedded data first (CORS-safe for file://)
  var key = path.split('/').pop();
  if (_rawDataMap[key]) {
    return JSON.parse(JSON.stringify(_rawDataMap[key])); // deep clone
  }
  // Fallback: try fetch (works when served via local server)
  try {
    var res = await fetch(path);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } catch (e) {
    console.warn('Failed to load JSON:', path, e);
    return null;
  }
}

function extractEssaySections(data) {
  if (!data) return [];
  var sections = [];
  if (data.introduction && typeof data.introduction === 'object') {
    var intro = data.introduction;
    var introContent = Array.isArray(intro.content) ? intro.content.join('\n\n') : (intro.content || '');
    if (intro.keyPoints) introContent += '\n\n**Key Points:**\n' + intro.keyPoints.map(function(p) { return '\u2022 ' + p; }).join('\n');
    if (intro.title || introContent) sections.push({ title: intro.title || 'Introduction', content: introContent });
  }
  if (Array.isArray(data.sections)) {
    data.sections.forEach(function(sec) { _flattenSection(sec, sections); });
  }
  if (Array.isArray(data) && data.length > 0 && (data[0].name || data[0].title)) {
    data.forEach(function(item) {
      var t = item.name || item.title || '';
      var c = item.description || item.content || '';
      var m = [item.category, item.subcategory].filter(Boolean).join(' \u2014 ');
      sections.push({ title: t, content: m ? '*' + m + '*\n\n' + c : c });
    });
  }
  if (data.beliefs) {
    var blines = Object.entries(data.beliefs).map(function(pair) {
      return '**' + pair[0].replace(/_/g, ' ').replace(/\b\w/g, function(l) { return l.toUpperCase(); }) + ':** ' + pair[1];
    });
    sections.push({ title: 'Beliefs & Spiritual Framework', content: blines.join('\n\n') });
  }
  if (Array.isArray(data.general_process)) {
    data.general_process.forEach(function(step) {
      var t = step.step || '';
      var c = step.description || '';
      if (step.traditional_method) c += '\n\n**Traditional Method:** ' + step.traditional_method;
      if (step.modern_method) c += '\n\n**Modern Method:** ' + step.modern_method;
      if (step.duties && Array.isArray(step.duties)) c += '\n\n' + step.duties.map(function(d) { return '\u2022 ' + d; }).join('\n');
      sections.push({ title: t, content: c });
    });
  }
  if (data.philosophy && data.philosophy.sections) {
    data.philosophy.sections.forEach(function(sec) {
      sections.push({ title: sec.heading || '', content: sec.content || '' });
    });
  }
  if (data.semanticCategories) {
    var sc = data.semanticCategories;
    if (sc.description) sections.push({ title: sc.title || 'Categories', content: sc.description });
    if (Array.isArray(sc.categories)) {
      sc.categories.forEach(function(cat) {
        var ex = (cat.examples || []).map(function(e) { return '\u2022 **' + e.name + '**: ' + (e.meaning || e.circumstance || e.context || ''); }).join('\n');
        sections.push({ title: cat.name, content: (cat.description || '') + (ex ? '\n\n' + ex : '') });
      });
    }
  }
  if (data.folkloreOverview) {
    var fo = data.folkloreOverview;
    var purp = fo.purposes ? fo.purposes.map(function(p) { return '\u2022 ' + p; }).join('\n') : '';
    sections.push({ title: fo.title || 'Folklore', content: (fo.description || '') + (purp ? '\n\n' + purp : '') });
  }
  if (data.topic && !data.sections && !data.introduction) {
    sections.push({ title: data.topic, content: data.subtitle || '' });
  }
  return sections;
}

function _flattenSection(sec, result) {
  if (!sec) return;
  var title = sec.heading || sec.title || '';
  var content = '';
  if (sec.content) content = Array.isArray(sec.content) ? sec.content.join('\n\n') : sec.content;
  if (sec.subsections && Array.isArray(sec.subsections)) {
    var subContent = sec.subsections.map(function(sub) {
      var sTitle = sub.heading || sub.title || '';
      var sText = Array.isArray(sub.content) ? sub.content.join('\n\n') : (sub.content || '');
      return sTitle ? '**' + sTitle + '**\n\n' + sText : sText;
    }).join('\n\n');
    content = (content ? content + '\n\n' : '') + subContent;
  }
  if (title || content) result.push({ title: title, content: content });
  if (sec.children && Array.isArray(sec.children)) {
    sec.children.forEach(function(child) { _flattenSection(child, result); });
  }
}

        id: topicId + '-sec-' + idx, name: sec.title || 'Section ' + (idx + 1),

function updateLogoImage() {

  img.src = isNationalMuseum

}

function updateLogoTitle(text) {
  const el = document.getElementById('logoTitle');
  if (el) el.textContent = text || 'Botswana National Museum';
  updateLogoImage();
}

function selectedMuseumName() {
  if (selectedMuseumId) {
    const m = MUSEUMS.find(m => m.id === selectedMuseumId);
    if (m) return m.name;
  }
  return 'Botswana National Museum';
}

function appArticle(collection, key) {
  if (!APP_DATA || !APP_DATA[collection]) return null;
  if (!key) return null;
  return APP_DATA[collection].find(a => a.key === key) || null;
}

function paragraphsToHtml(text) {
  if (!text) return '';
  return text.split(/\n{2,}/).map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('');
}

function parseMuseumSections(body) {
  const overview = [];
  const groups = ['', '', '', '', '', '', ''];

  if (!body) return { overview: '', groups };

  const paragraphs = body.split(/\n{2,}/).filter(p => p.trim() && !/^---+\s*$/.test(p.trim()));
  const headerPattern = /^\d+\.\s+[A-Z][A-Z0-9 '&+\-/()?:#,"]*$/;

  let current = -1;
  paragraphs.forEach(p => {
    const lines = p.trim().split('\n');
    const first = lines[0].trim();
    const rest = lines.slice(1).join('\n').trim();
    let section = -1;

    if (/^quick fact/i.test(first)) section = 5;
    else if (/^comparison:?\s*$/i.test(first)) section = 6;
    else if (/^HOW TO EXPLAIN IT TO PEOPLE INTERESTED IN HISTORY:/.test(first)) section = 4;
    else if (headerPattern.test(first)) {
      if ((/\bMEANS\b/i.test(first) && /\b(CULTUR|HISTOR)/i.test(first)) || (/\bCULTUR/.test(first) && /\bHISTOR/.test(first))) section = 2;
      else if (/TODAY|VISITING/.test(first)) section = 3;
      else if (/WHAT'S INSIDE|WHAT'S AT|EXHIBIT|GALLER|EDUCATION CENTRE|IS THERE A MUSEUM/.test(first)) section = 1;
      else section = 0;
    }

    if (section >= 0) {
      current = section;
      if (rest) groups[current] = groups[current] ? groups[current] + '\n\n' + rest : rest;
    } else if (current < 0) {
      overview.push(p);
    } else {
      groups[current] = groups[current] ? groups[current] + '\n\n' + p : p;
    }
  });

  return { overview: overview.join('\n\n'), groups };
}

function toggleAcc(el) {
  const acc = el.closest('.acc');
  if (!acc) return;
  const open = acc.classList.contains('open');
  const parent = acc.parentElement;
  if (parent) {
    parent.querySelectorAll(':scope > .acc.open').forEach(a => {
      if (a !== acc) a.classList.remove('open');
    });
  }
  acc.classList.toggle('open', !open);
}

function pushView(view) {
  stack.push(view);
  render();
}

function stopQuizTimers() {
  clearInterval(timerHandle);
  clearTimeout(timerHandle);
  timerHandle = null;
}

function popView() {
  if (stack.length > 0) {
    stack.pop();
    if (!stack.length || (stack[stack.length - 1].type !== 'quizplay' && stack[stack.length - 1].type !== 'quizresult')) {
      stopQuizTimers();
    }
    render();
  }
}

function render() {
  if (stack.length === 0) {
    showTabContentOnly();
    document.getElementById('backButtonContainer').classList.remove('show');
    return;
  }

  const view = stack[stack.length - 1];

  if (view.type !== 'museum-detail') {
    document.getElementById('backButtonContainer').classList.add('show');
  } else {
    document.getElementById('backButtonContainer').classList.remove('show');
  }
  if (view.type === 'museum-detail') renderMuseumDetail(view.id);
  if (view.type === 'museum-gallery') renderMuseumGallery();
  if (view.type === 'gallery-photo') renderGalleryPhoto(view.src);
  if (view.type === 'explore-category') renderCategory(view.id);
  if (view.type === 'explore-item') renderItem(view.catId, view.itemId);
  if (view.type === 'dance-page') renderDancePage();
  if (view.type === 'dance-detail') renderDanceDetail(view.key);
  if (view.type === 'event-detail') renderEventDetail(view.id);
  if (view.type === 'event-booking') renderEventBooking(view.eventId, view.bookingType);
  if (view.type === 'booking-tickets') renderBookingTickets();
  if (view.type === 'booking-restaurant') renderBookingRestaurant();
  if (view.type === 'booking-venue') renderBookingVenue();
  if (view.type === 'booking-summary') renderBookingSummary();
  if (view.type === 'display-page') renderDisplayPage();
  if (view.type === 'display-item') renderDisplayItem(view.id);
  if (view.type === 'around-detail') renderAroundDetail(view.key);
  if (view.type === 'culture-group') renderCultureGroup(view.id);
  if (view.type === 'culture-sub') renderCultureSub(view.id, view.subId);
  if (view.type === 'merch-page') renderMerchPage();
  if (view.type === 'merch-detail') renderMerchDetail(view.num);
  if (view.type === 'quizplay') renderQuizPlay();
  if (view.type === 'quizresult') renderQuizResult();
}

function showTabContentOnly() {
  if (activeTab === 'about') renderAboutHome();
  if (activeTab === 'explore') renderExploreHome();
  if (activeTab === 'engage') renderEngageHome();
  if (activeTab === 'learn') renderLearnHome();
  if (activeTab === 'menu') renderMenuHome();
}

function showTab(tab) {
  activeTab = tab;
  stack = [];
  stopQuizTimers();
  render();
  updateNavHighlight();
}

function updateNavHighlight() {
  document.querySelectorAll('.navbtn').forEach(btn => {
    if (btn.dataset.tab === activeTab) {
      btn.classList.add('active');
    } else {
      btn.classList.remove('active');
    }
  });
}

/* =========================================================
   IMAGE UPLOAD HANDLER
========================================================= */

function triggerImageUpload(id) {
  currentUploadId = id;
  document.getElementById('fileInput').click();
}

function handleImageUpload(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (e) => {
    imageStorage[currentUploadId] = e.target.result;
    render();
  };
  reader.readAsDataURL(file);
}

function getImage(id) {
  return imageStorage[id] || '';
}

/* =========================================================
   SCROLL-HIDE NAV BEHAVIOR
========================================================= */

const contentEl = document.getElementById('content');
const bottomNav = document.getElementById('bottomNav');

contentEl.addEventListener('scroll', () => {
  const currentScrollY = contentEl.scrollTop;
  const logoSpace = document.getElementById('logoSpace');
  const backBtn = document.getElementById('backButtonContainer');
  
  if (currentScrollY > lastScrollY) {
    // Scrolling down - hide logo, bottom nav, and back button
    bottomNav.classList.add('hide');
    if (logoSpace) logoSpace.classList.add('hide');
    if (backBtn) backBtn.classList.add('hide');
  } else {
    // Scrolling up - show logo, bottom nav, and back button
    bottomNav.classList.remove('hide');
    if (logoSpace) logoSpace.classList.remove('hide');
    if (backBtn) backBtn.classList.remove('hide');
  }
  lastScrollY = currentScrollY;
});

function renderCalendar() {
  const year = bookingCurrentMonth.getFullYear();
  const month = bookingCurrentMonth.getMonth();
  const monthName = bookingCurrentMonth.toLocaleString('default', { month: 'long', year: 'numeric' });

  document.getElementById('cal-month-year').textContent = monthName;

  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const prevLastDay = new Date(year, month, 0).getDate();

  const datesContainer = document.getElementById('calendar-dates');
  datesContainer.innerHTML = '';

  for (let i = firstDay.getDay() - 1; i >= 0; i--) {
    const day = prevLastDay - i;
    const dateEl = document.createElement('div');
    dateEl.className = 'date unavailable';
    dateEl.textContent = day;
    datesContainer.appendChild(dateEl);
  }

  for (let day = 1; day <= lastDay.getDate(); day++) {
    const dateEl = document.createElement('div');
    const dateObj = new Date(year, month, day);
    const dateStr = dateObj.toISOString().split('T')[0];
    const isPast = dateObj < new Date();

    dateEl.className = 'date';
    if (isPast) {
      dateEl.classList.add('unavailable');
    } else {
      dateEl.classList.add('available');
      dateEl.onclick = () => selectDate(dateStr);
    }
    dateEl.textContent = day;
    datesContainer.appendChild(dateEl);
  }

  const remainingDays = 42 - datesContainer.children.length;
  for (let day = 1; day <= remainingDays; day++) {
    const dateEl = document.createElement('div');
    dateEl.className = 'date unavailable';
    dateEl.textContent = day;
    datesContainer.appendChild(dateEl);
  }
}

function prevMonth() {
  bookingCurrentMonth = new Date(bookingCurrentMonth.getFullYear(), bookingCurrentMonth.getMonth() - 1);
  renderCalendar();
}

function nextMonth() {
  bookingCurrentMonth = new Date(bookingCurrentMonth.getFullYear(), bookingCurrentMonth.getMonth() + 1);

function startGame(gameId) {
  const game = GAMES.find(g => g.id === gameId);
  quizState = {
    game,
    qIndex: 0,
    score: 0,
    answered: false
  };
  pushView({ type: 'quizplay' });
}

function renderQuizPlay() {
  clearInterval(timerHandle);
  if (!quizState || !quizState.game) {
    stopQuizTimers();
    stack.pop();
    render();
    return;
  }
  const { game, qIndex, score } = quizState;
  const q = game.questions[qIndex];
  quizState.answered = false;
  setHeader(game.title, `Question ${qIndex + 1} / ${game.questions.length}`, true);

  const pct = Math.round((qIndex / game.questions.length) * 100);
  const letters = ['A', 'B', 'C', 'D'];

  let html = `
    <div class="quiz-head">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span class="score-pill">SCORE ${score}</span>
        <span class="score-pill">${game.icon} ${game.title}</span>
      </div>
      <div class="progress-outer"><div class="progress-inner" style="width:${pct}%"></div></div>
    </div>
    <div class="timer-outer"><div class="timer-inner" id="timerBar"></div></div>
    <div class="qtext-wrap">
      <div class="qlabel">Q${qIndex + 1}</div>
      <h3>${q.q}</h3>
    </div>
    <div class="options" id="optionsWrap">
      ${q.options.map((opt, i) => `
        <div class="opt" data-i="${i}" onclick="answerQuiz(${i})">
          <span class="oletter">${letters[i]}</span><span>${opt}</span>
        </div>
      `).join('')}
    </div>
  `;

  document.getElementById('content').innerHTML = html;

  // 5-second timer bar
  const bar = document.getElementById('timerBar');
  bar.style.transition = 'none';
  bar.style.transform = 'scaleX(1)';
  requestAnimationFrame(() => {
    bar.style.transition = 'transform 5s linear';
    bar.style.transform = 'scaleX(0)';
  });
  timerHandle = setTimeout(() => {
    if (!quizState.answered) answerQuiz(-1);
  }, 5000);
}

function answerQuiz(selectedIndex) {
  if (!quizState || !quizState.game) return;
  if (quizState.answered) return;
  quizState.answered = true;
  clearInterval(timerHandle);
  clearTimeout(timerHandle);

  const { game, qIndex } = quizState;
  const q = game.questions[qIndex];
  const opts = document.querySelectorAll('#optionsWrap .opt');

  opts.forEach((el, i) => {
    el.classList.add('disabled');
    if (i === q.correct) el.classList.add('correct');
    else if (i === selectedIndex) el.classList.add('wrong');
  });

  if (selectedIndex === q.correct) quizState.score++;

  timerHandle = setTimeout(() => {
    if (!quizState) return;
    if (qIndex + 1 < game.questions.length) {
      quizState.qIndex++;
      renderQuizPlay();
    } else {
      stack[stack.length - 1] = { type: 'quizresult' };
      renderQuizResult();
    }
  }, 900);
}

function renderQuizResult() {
  clearInterval(timerHandle);
  if (!quizState || !quizState.game) {
    stack.pop();
    render();
    return;
  }
  const { game, score } = quizState;
  const total = game.questions.length;
  const pct = Math.round((score / total) * 100);
  let msg = "Keep exploring!";
  if (pct >= 90) msg = "Curator-level knowledge!";
  else if (pct >= 70) msg = "Excellent — you know Botswana well.";
  else if (pct >= 50) msg = "Good effort — keep learning!";

  setHeader(game.title, "Results", false);

  document.getElementById('content').innerHTML = `
    <div class="quiz-result">
      <div class="hero-badge" style="justify-content:center; display:flex;">${game.icon} ${game.title}</div>
      <div class="big">${score}/${total}</div>
      <p>${msg}</p>
      <button class="primary-btn" onclick="startGame('${game.id}')">Play Again</button>
      <button class="ghost-btn" onclick="showTab('learn')">Back to Learn</button>
    </div>
    <div style="height:14px;"></div>
  `;
  document.getElementById('backButtonContainer').classList.remove('show');
}
